<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 15：纯 CSS 翻转卡片</title>
    <link rel="stylesheet" href="flip-card.css">
</head>
<body>
    <div class="card-container">
        <div class="card-inner">
            <!-- 正面 -->
            <div class="card-front">
                <img src="https://picsum.photos/id/104/300/300" alt="风景图片">
            </div>
            <!-- 背面 -->
            <div class="card-back">
                <h3>宁静的湖畔</h3>
                <p>这张图片来自 picsum 免费图库。背面的文字描述可以介绍这张图片的由来或情感。</p>
                <p>使用 CSS 3D 翻转效果，悬停即可看到背面内容。</p>
            </div>
        </div>
    </div>
</body>
</html>
