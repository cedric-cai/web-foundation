<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人简介</title>
    <style>
    body {
        background: #f0f2f5;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-family: system-ui, 'Segoe UI', sans-serif;
        margin: 0;
        padding: 1rem;
    }
    .card {
        background: white;
        border-radius: 24px;
        padding: 2rem;
        box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        max-width: 320px;
        width: 100%;
        text-align: center;
        transition: transform 0.2s;
    }
    .card:hover {
        transform: scale(1.02);
    }
    h1 {
        font-size: 1.8rem;
        margin-bottom: 0.5rem;
    }
    p {
        color: #4b5563;
        line-height: 1.5;
    }
    a {
        display: inline-block;
        margin-top: 1rem;
        background: #2563eb;
        color: white;
        padding: 0.5rem 1.2rem;
        border-radius: 30px;
        text-decoration: none;
        font-weight: bold;
    }
    a:hover {
        background: #1d4ed8;
    }

    /* 📱 手机专用调整 */
    @media (max-width: 600px) {
        body {
            align-items: flex-start;  /* 让卡片从顶部开始，不强制垂直居中 */
            padding: 0.75rem;
        }
        .card {
            padding: 1.25rem;
        }
        h1 {
            font-size: 1.5rem;
        }
        p {
            font-size: 0.9rem;
        }
        a {
            padding: 0.4rem 1rem;
            font-size: 0.9rem;
        }
    }
        ul {
        padding-left: 1.5rem;
        margin-top: 0.5rem;
}
         li {
        margin-bottom: 0.3rem;
}
</style>
</head>
<body>
    <div class="card">

    <h1>👋 你好，我是 阿来</h1>

    <p>📍 来自 深圳 | 💻 目前学 HTML/CSS | 🎯 目标：全栈开发</p>
    <p>✨ 日常爱好：</p>
<ul style="text-align: left; color: #4b5563;">
    <li>📖 读科幻小说</li>
    <li>⚡ 折腾电脑硬件</li>
    <li>☕ 手冲咖啡</li>
</ul>

</html>
