<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>周末实战：产品卡片 - 高仿真苹果/小米风格</title>
    <link rel="stylesheet" href="product-cards.css">
</head>
<body>
    <div class="container">
        <h1 class="page-title">✨ 精选好物 ✨</h1>
        <div class="cards-grid">
            <!-- 卡片 1 -->
            <div class="card">
                <div class="card-img-wrapper">
                    <img src="https://picsum.photos/id/20/400/300" alt="产品图片：经典腕表" loading="lazy">
                </div>
                <div class="card-content">
                    <h3 class="product-name">极简时光腕表</h3>
                    <p class="product-desc">意大利牛皮表带，蓝宝石玻璃</p>
                    <div class="price">¥1,299</div>
                    <button class="buy-btn">立即购买 →</button>
                </div>
            </div>
            <!-- 卡片 2 -->
            <div class="card">
                <div class="card-img-wrapper">
                    <img src="https://picsum.photos/id/30/400/300" alt="产品图片：无线耳机" loading="lazy">
                </div>
                <div class="card-content">
                    <h3 class="product-name">灵动降噪耳机</h3>
                    <p class="product-desc">主动降噪，30小时续航</p>
                    <div class="price">¥899</div>
                    <button class="buy-btn">立即购买 →</button>
                </div>
            </div>
            <!-- 卡片 3 -->
            <div class="card">
                <div class="card-img-wrapper">
                    <img src="https://picsum.photos/id/96/400/300" alt="产品图片：智能手环" loading="lazy">
                </div>
                <div class="card-content">
                    <h3 class="product-name">活力运动手环</h3>
                    <p class="product-desc">心率监测，50米防水</p>
                    <div class="price">¥399</div>
                    <button class="buy-btn">立即购买 →</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
