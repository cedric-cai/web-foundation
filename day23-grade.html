<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 23：成绩等级判断器</title>
    <style>
        body {
            font-family: system-ui, 'Segoe UI', sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background: white;
            border-radius: 24px;
            padding: 2rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 500px;
        }
        code {
            background: #eef2ff;
            padding: 0.2rem 0.4rem;
            border-radius: 8px;
            font-family: monospace;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 30px;
            margin-top: 1rem;
            cursor: pointer;
            font-size: 1rem;
        }
        button:hover {
            background: #1d4ed8;
        }
        pre {
            text-align: left;
            background: #f8fafc;
            padding: 1rem;
            border-radius: 16px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>📊 成绩等级判断器</h1>
        <p>请按 <kbd>F12</kbd> 打开开发者工具，查看 <strong>Console（控制台）</strong> 输出。</p>
        <p>当前测试分数：<strong id="scoreDisplay">85</strong> 分</p>
        <button id="testBtn">测试其他分数（循环 5 个示例）</button>
        <hr>
        <p>✅ 包含功能：</p>
        <ul style="text-align: left;">
            <li>合法分数判断（0-100）</li>
            <li>优秀 (≥90) / 良好 (≥80) / 及格 (≥60) / 不及格 (&lt;60)</li>
            <li>使用 <code>if...else if...else</code></li>
            <li>严格的类型和范围检查</li>
        </ul>
    </div>

    <script>
        // 核心函数：判断等级并输出到控制台
        function evaluateScore(score) {
            // 合法性检查：必须是数字，且在 0-100 之间
            if (typeof score !== 'number' || isNaN(score) || score < 0 || score > 100) {
                console.log(`❌ 分数：${score} → 请输入有效的分数（0-100）`);
                return;
            }

            // 等级判断（从大到小）
            if (score >= 90) {
                console.log(`🎉 分数：${score} → 优秀 🎉`);
            } else if (score >= 80) {
                console.log(`👍 分数：${score} → 良好 👍`);
            } else if (score >= 60) {
                console.log(`📚 分数：${score} → 及格 📚`);
            } else {
                console.log(`💪 分数：${score} → 不及格 💪 继续加油`);
            }
        }

        // 1. 测试单个分数（修改这里的数字即可）
        let score = 85;
        console.log('========== 成绩等级判断器 ==========');
        evaluateScore(score);

        // 可选挑战：额外测试一组边界数据
        const testScores = [95, 80, 60, 59, 101, -5, 'abc', 75];
        console.log('\n========== 附加测试（多种数据） ==========');
        testScores.forEach(s => evaluateScore(s));

        // 绑定按钮：演示动态测试（不会覆盖上面的输出，只是追加）
        const btn = document.getElementById('testBtn');
        const scoreSpan = document.getElementById('scoreDisplay');
        let demoIndex = 0;
        const demoArray = [92, 78, 45, 100, 30];
        btn.addEventListener('click', () => {
            let demoScore = demoArray[demoIndex % demoArray.length];
            scoreSpan.textContent = demoScore;
            console.log(`\n[按钮测试] 新分数：${demoScore}`);
            evaluateScore(demoScore);
            demoIndex++;
        });
    </script>
</body>
</html>
