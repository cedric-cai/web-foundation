<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新用户注册 - Day 3 表单作业</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
        }
        .register-container {
            background: white;
            max-width: 550px;
            width: 100%;
            border-radius: 32px;
            padding: 2rem 1.8rem;
            box-shadow: 0 25px 45px rgba(0,0,0,0.2);
        }
        h1 {
            text-align: center;
            color: #1e293b;
            margin-bottom: 0.25rem;
            font-size: 1.8rem;
        }
        .sub {
            text-align: center;
            color: #64748b;
            font-size: 0.85rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 0.75rem;
        }
        fieldset {
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 1.2rem 1.2rem 1.5rem;
            margin-bottom: 1.5rem;
        }
        legend {
            font-weight: 600;
            color: #334155;
            padding: 0 0.75rem;
            font-size: 1rem;
        }
        .form-group {
            margin-bottom: 1.2rem;
        }
        label {
            display: block;
            font-weight: 500;
            margin-bottom: 0.4rem;
            color: #0f172a;
        }
        input, select {
            width: 100%;
            padding: 0.7rem 0.9rem;
            border: 1px solid #cbd5e1;
            border-radius: 16px;
            font-size: 1rem;
            transition: all 0.2s;
            font-family: inherit;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.2);
        }
        .radio-group, .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 1.2rem;
            margin-top: 0.3rem;
        }
        .radio-group label, .checkbox-group label {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-weight: normal;
            margin-bottom: 0;
            cursor: pointer;
        }
        input[type="radio"], input[type="checkbox"] {
            width: auto;
            margin-right: 0.2rem;
            accent-color: #667eea;
        }
        button {
            width: 100%;
            background: #667eea;
            color: white;
            border: none;
            padding: 0.8rem;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 0.5rem;
        }
        button:hover {
            background: #5a67d8;
            transform: scale(0.98);
        }
        .required-mark {
            color: #e53e3e;
            margin-left: 0.2rem;
        }
        small {
            color: #64748b;
            font-size: 0.7rem;
            display: block;
            margin-top: 0.3rem;
        }
        @media (max-width: 500px) {
            .register-container {
                padding: 1.5rem;
            }
            .radio-group, .checkbox-group {
                gap: 0.8rem;
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <h1>📝 注册账号</h1>
        <div class="sub">欢迎加入，请填写真实信息</div>

        <form action="#" method="post">
            <!-- 基本信息分组 -->
            <fieldset>
                <legend>🔐 基本信息</legend>
                
                <!-- 1. 用户名（必填） -->
                <div class="form-group">
                    <label for="username">
                        用户名 <span class="required-mark">*</span>
                    </label>
                    <input type="text" id="username" name="username" 
                           placeholder="例如：阿来同学" required>
                    <small>必填，之后可用来登录</small>
                </div>

                <!-- 2. 密码（必填） -->
                <div class="form-group">
                    <label for="password">
                        密码 <span class="required-mark">*</span>
                    </label>
                    <input type="password" id="password" name="password" 
                           placeholder="至少6位字母或数字" required>
                </div>

                <!-- 3. 性别（radio，默认保密） -->
                <div class="form-group">
                    <span class="label-text">性别</span>
                    <div class="radio-group">
                        <label for="gender-male">
                            <input type="radio" id="gender-male" name="gender" value="男"> 男
                        </label>
                        <label for="gender-female">
                            <input type="radio" id="gender-female" name="gender" value="女"> 女
                        </label>
                        <label for="gender-secret">
                            <input type="radio" id="gender-secret" name="gender" value="保密" checked> 保密
                        </label>
                    </div>
                </div>
            </fieldset>

            <!-- 额外信息分组 -->
            <fieldset>
                <legend>✨ 额外信息</legend>

                <!-- 4. 爱好（复选框） -->
                <div class="form-group">
                    <span class="label-text">爱好（可多选）</span>
                    <div class="checkbox-group">
                        <label for="hobby-coding">
                            <input type="checkbox" id="hobby-coding" name="hobby" value="编码"> 编码
                        </label>
                        <label for="hobby-reading">
                            <input type="checkbox" id="hobby-reading" name="hobby" value="读书"> 读书
                        </label>
                        <label for="hobby-travel">
                            <input type="checkbox" id="hobby-travel" name="hobby" value="旅行"> 旅行
                        </label>
                        <label for="hobby-music">
                            <input type="checkbox" id="hobby-music" name="hobby" value="音乐"> 音乐
                        </label>
                    </div>
                </div>

                <!-- 5. 城市（下拉框） -->
                <div class="form-group">
                    <label for="city">所在城市</label>
                    <select id="city" name="city">
                        <option value="北京">北京</option>
                        <option value="上海">上海</option>
                        <option value="广州">广州</option>
                        <option value="深圳" selected>深圳</option>
                    </select>
                </div>
            </fieldset>

            <!-- 6. 提交按钮 -->
            <button type="submit">✅ 立即注册</button>
        </form>
    </div>
</body>
</html>
